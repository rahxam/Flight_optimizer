    name: Ramadan 2027
    start: "2027-02-08"
    end: "2027-03-09"
    affects: [Oman, Malaysia, Indonesien]
    impact: medium
    note: >-
      Endet VOR dem geplanten Reisebeginn. Relevant nur, wenn du vor dem 10.03.
      in Oman/Malaysia/Indonesien startest (Restaurants tagsueber geschlossen).
    confidence: predicted

