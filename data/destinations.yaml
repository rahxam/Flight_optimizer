# ---------------------------------------------------------------------------
# Kandidaten-Ziele fuer die Workation 15.03.2027 - 08.05.2027 (4-6 Wochen)
#
# Bewertungsskalen: 0-10, IMMER "hoeher = besser".
#   weather : trocken/angenehm, wenig Regen, ertraegliche Hitze
#   surf    : Wellenqualitaet + Konsistenz SPEZIELL fuer Longboard (lange, sanfte Walls)
#   calm    : Abwesenheit von Crowds / Feiertagschaos / Hochpreisphasen
# work           : Internet, Coworking, Strom, Arbeitsfaehigkeit (konstant pro Ziel)
# activity_score : Vielfalt und Qualitaet von GANZTAGES-Ausfluegen (konstant pro Ziel).
#                  Gewichtet nach dem, was die Nutzer wollen: Canyoning, Rafting,
#                  Trekking, Mehrtages-Bootstouren - nicht nur Surfen.
# multiday       : konkrete Mehrtagestouren, die als Urlaubsblock funktionieren
# tz_offset_vs_madrid_winter : Stunden Versatz zu Madrid (vor 28.03.2027 = CET).
#             Ab 28.03.2027 (EU-Sommerzeit) schrumpft der Versatz um 1 h.
# cost_per_day_eur_pp : Unterkunft + Essen + lokale Mobilitaet + Ausfluege,
#                  pro Person/Tag. Gerechnet fuer den tatsaechlichen Reisestil:
#                  Hotelwechsel etwa alle 3 Tage (also KEINE Monatsmieten),
#                  unter 50 EUR pro Nacht fuers Doppelzimmer = bis 25 EUR pro
#                  Person, dazu Essen (~13), lokale Mobilitaet und Inlandshops
#                  (~6) und ein aktives Ausflugsprogramm (~6).
#                  Jedes "Ziel" ist eine REGION mit mehreren Standorten - die
#                  Wechsel innerhalb einer Region stecken in diesem Tagessatz,
#                  nicht in einem eigenen Routenbaustein.
# Quellen/Begruendung siehe docs/seasonality.md
# ---------------------------------------------------------------------------
meta:
  trip_year: 2027
  windows: ["2027-03-H1", "2027-03-H2", "2027-04-H1", "2027-04-H2", "2027-05-H1"]
  window_dates:
    "2027-03-H1": ["2027-03-01", "2027-03-15"]
    "2027-03-H2": ["2027-03-16", "2027-03-31"]
    "2027-04-H1": ["2027-04-01", "2027-04-15"]
    "2027-04-H2": ["2027-04-16", "2027-04-30"]
    "2027-05-H1": ["2027-05-01", "2027-05-15"]

