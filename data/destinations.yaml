    region_short: "SL Süd"
    tier: A
    airports: [CMB, HRI]
    primary_airport: CMB
    tropical: true
    work: 8
    tz_offset_vs_madrid_winter: 4.5
    cost_per_day_eur_pp: 48
    activities: [longboard, shortboard, snorkel, whale_watching, safari_udawalawe, jungle_hike, scooter, yoga]
    activity_score: 8
    multiday:
      - "Udawalawe- oder Yala-Safari (1 Tag)"
      - "Hochland Ella / Horton Plains (2-3 Tage)"
      - "Rafting + Canyoning Kitulgala (1-2 Tage)"
      - "Walbeobachtung Mirissa (halber Tag)"
    hub_to_base_h: 2.5
    scores:
      "2027-03-H1": {weather: 9, surf: 9, calm: 6, note: "Kernsaison Suedkueste, offshore Vormittage, 2-5ft"}
      "2027-03-H2": {weather: 9, surf: 9, calm: 6, note: "Weiter top; Ostern 28.03. bringt europ. Kurzurlauber"}
      "2027-04-H1": {weather: 8, surf: 8, calm: 4, note: "Heiss+feucht steigend; 13./14.04. Sinhala/Tamil New Year -> Land steht still"}
      "2027-04-H2": {weather: 7, surf: 7, calm: 7, note: "Saisonende naht, erste Gewitter, leerer"}
      "2027-05-H1": {weather: 4, surf: 4, calm: 7, note: "SW-Monsun setzt ein, Suedkueste onshore/choppy -> raus hier"}
    notes: >-
      Das beste Longboard-Ziel der Liste fuer Maerz. Weligama Bay + die Rechte vor
      Ceylon Sliders sind klassische Longboard-Wellen, Hiriketiya ein windgeschuetzter
      Links-Reef mit langen Sections. Dichtes Coworking-Netz (Verse Collective Ahangama,
      Hideout, Kip). Standortwechsel Weligama -> Ahangama -> Hiriketiya in 1-2 h Scooter.
      Zeitzone +4.5 h ist fuer europaeische Calls noch gut machbar (EU-Morgen = SL-Mittag).

