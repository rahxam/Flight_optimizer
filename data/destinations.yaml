      ab KUL/SIN erreichbar, sonst Transit (nicht Aufenthalt) via DPS/CGK.
    constraints:
      avoid_dates: [["2027-03-05", "2027-03-16"]]
      avoid_reason: "Lebaran/Mudik-Reisewelle um Idul Fitri (~10.03.2027): Inlandsfluege teuer und ausgebucht"

