# Fallback-Schaetzpreise und Routenwissen, solange keine echten Scrapes vorliegen.
# ALLE Werte sind Richtwerte in EUR pro Person, Economy, 1 Gepaeckstueck + Boardbag
# nicht eingerechnet (siehe baggage.boardbag_eur).
# Sobald data/prices/*.csv existiert, haben echte Preise Vorrang.
meta:
  currency: EUR
  estimated: true
  as_of: "2026-10-25"

baggage:
  boardbag_eur: 90        # pro Strecke pro Boardbag, Richtwert Langstrecke
  boardbag_note: >-
    Longboards (>8 ft) sind bei vielen Airlines Sondergepaeck oder gar nicht
    erlaubt. Fuer Longboard-Ziele lieber vor Ort mieten (SL/Lombok: 8-15 EUR/Tag)
    und nur ein Mid-Length/Funboard im Bag mitnehmen (max. 7'6").
  checked_bag_eur: 60

