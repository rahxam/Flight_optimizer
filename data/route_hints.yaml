  Laos: 35
  Indien: 35          # e-Visum 30 Tage
  Madagaskar: 35

# Saisonale Aufschlaege auf SCHAETZPREISE (echte Scrapes bleiben unberuehrt).
# applies_to: "eu_departure" = Abflug ab EU-Hub, "eu_return" = Ankunft an EU-Hub,
#             oder eine Liste von Flughafencodes (ein Endpunkt genuegt).
estimate_multipliers:
  - start: "2027-03-19"
    end: "2027-03-30"
    factor: 1.28
    applies_to: eu_departure
    reason: "Semana Santa / Ostern - teuerste Woche ab MAD/BCN"
  - start: "2027-03-19"
    end: "2027-03-30"
    factor: 1.22
    applies_to: eu_return
    reason: "Semana Santa / Ostern - Rueckreisewelle"
  - start: "2027-03-05"
    end: "2027-03-16"
    factor: 1.25
    applies_to: [LOP, KUL, PEN, LGK, BMU, PDG]
    reason: "Lebaran / Hari Raya - Mudik-Reisewelle Indonesien/Malaysia"
