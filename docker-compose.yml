services:
  flight-tracker:
    build: .
    image: workation-flight-tracker:latest
    container_name: flight-tracker
    restart: unless-stopped
    environment:
      # Abstand zwischen zwei Laeufen. 12 h sind ein guter Kompromiss:
      # Flugpreise bewegen sich nicht stuendlich, und wenig Last heisst
      # weniger Captchas.
      INTERVAL_HOURS: "12"
      # Suchen pro Lauf. Die Kalender-Matrix hat gut 90 Suchen; mit 120 wird
      # sie in jedem Lauf ganz abgearbeitet (~30-40 min mit Preisgrafik).
      QUERIES_PER_RUN: "120"
      DELAY_SECONDS: "7"
      DEAL_DROP_PCT: "15"
      JITTER_MINUTES: "20"
      TZ: "Atlantic/Canary"
    volumes:
      # Rohdaten und SQLite-Historie ueberleben jeden Rebuild.
      - flight-prices:/app/data/prices
    # Chromium braucht mehr /dev/shm als Docker per Default gibt.
    shm_size: "1gb"
    # Kein Port nach aussen: der Container redet nur raus.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Read-only web view of the history (scripts/web.py). Shares the image and the
  # volume with the tracker. No login of its own: expose it only behind a proxy
  # with authentication, or keep the port on localhost as here.
  flight-web:
    image: workation-flight-tracker:latest
    container_name: flight-web
    restart: unless-stopped
    depends_on:
      - flight-tracker
    entrypoint: ["python3", "/app/scripts/web.py"]
    environment:
      TZ: "Atlantic/Canary"
    volumes:
      - flight-prices:/app/data/prices
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  flight-prices:
